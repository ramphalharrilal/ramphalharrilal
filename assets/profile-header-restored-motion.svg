<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ramphal Harrilal — Websites, Support and Practical Business Solutions</title>
  <desc id="desc">A dark navy professional banner with emerald highlights, Ramphal Harrilal's name, areas of focus, and RH monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1b2d"/>
      <stop offset="1" stop-color="#093b39"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7f3d0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9ff4d2" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace}
      @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
      @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1710px)}}
      @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
      @keyframes floatX{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
      @keyframes status{0%,100%{opacity:.5;transform:scale(.76)}50%{opacity:1;transform:scale(1.3)}}
      @keyframes statusRing{0%{opacity:.75;transform:scale(.65)}100%{opacity:0;transform:scale(1.75)}}
      @keyframes spotlight{0%,22%,100%{opacity:.35;fill:#64748b}11%{opacity:1;fill:#6ee7b7}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.12}}
      @keyframes growLine{0%,100%{transform:scaleX(.2);opacity:.45}50%{transform:scaleX(1);opacity:1}}
      .glow{animation:breathe 4.2s ease-in-out infinite}.scanbar{animation:sweep 4.8s ease-in-out infinite}
      .particle{filter:drop-shadow(0 0 6px #34d399)}.p1{animation:floatY 3.8s ease-in-out infinite}.p2{animation:floatY 4.9s ease-in-out infinite}.p3{animation:floatX 4.2s ease-in-out infinite}
      .status{transform-box:fill-box;transform-origin:center;animation:status 1.8s ease-in-out infinite}
      .statusRing{transform-box:fill-box;transform-origin:center;animation:statusRing 1.8s ease-out infinite}
      .word{animation:spotlight 8s ease-in-out infinite}.w2{animation-delay:2s}.w3{animation-delay:4s}.w4{animation-delay:6s}
      .cursor{animation:blink .9s steps(1) infinite}.titleLine{transform-origin:left;animation:growLine 3.2s ease-in-out infinite}
      .monofill{animation:breathe 2.8s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect class="glow" width="1200" height="360" rx="24" fill="url(#glow)" opacity="0.72"/>
  <g transform="skewX(-13)"><rect class="scanbar" x="-260" y="0" width="260" height="360" fill="url(#scan)" opacity="0.95"/></g>
  <path d="M0 312C210 277 340 342 563 310S908 255 1200 307V360H0Z" fill="#34d399" opacity="0.045"/>
  <g class="particle" fill="#6ee7b7">
    <circle class="p1" cx="735" cy="71" r="3.2" opacity="0.65"/>
    <circle class="p2" cx="803" cy="292" r="4" opacity="0.5"/>
    <circle class="p3" cx="1135" cy="325" r="3" opacity="0.62"/>
  </g>

  <g class="sans">
    <rect x="64" y="49" width="228" height="34" rx="17" fill="#0c2d2a" stroke="#34d399" stroke-opacity="0.55"/>
    <circle class="statusRing" cx="84" cy="66" r="7" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <circle class="status" cx="84" cy="66" r="5" fill="#34d399"/>
    <text x="99" y="71" fill="#b8f7dc" font-size="12" font-weight="700" letter-spacing="1.4">OPEN TO REMOTE ROLES</text>

    <text x="64" y="153" fill="#f8fafc" font-size="58" font-weight="760" letter-spacing="-1.8">Ramphal Harrilal</text>
    <text x="66" y="193" fill="#7de4c0" font-size="17" font-weight="700" letter-spacing="2.1">WEBSITES  •  SUPPORT  •  BUSINESS SOLUTIONS</text>
    <rect class="titleLine" x="66" y="206" width="286" height="2" rx="1" fill="#34d399"/>
    <text x="66" y="239" fill="#b8c7d9" font-size="17">I solve operational problems with calm support, clear systems,</text>
    <text x="66" y="265" fill="#b8c7d9" font-size="17">and practical software built around how people actually work.</text>

    <g transform="translate(66 300)">
      <text class="mono word" x="0" y="14" fill="#6ee7b7" font-size="13" opacity="0.5">solve</text>
      <circle cx="53" cy="9" r="2.5" fill="#456176"/>
      <text class="mono word w2" x="67" y="14" fill="#94a3b8" font-size="13" opacity="0.5">document</text>
      <circle cx="145" cy="9" r="2.5" fill="#456176"/>
      <text class="mono word w3" x="159" y="14" fill="#94a3b8" font-size="13" opacity="0.5">improve</text>
      <circle cx="224" cy="9" r="2.5" fill="#456176"/>
      <text class="mono word w4" x="238" y="14" fill="#94a3b8" font-size="13" opacity="0.5">deliver</text>
      <rect class="cursor" x="292" y="1" width="2.5" height="16" rx="1" fill="#6ee7b7"/>
    </g>
  </g>

  <g transform="translate(873 50)" filter="url(#shadow)">
    <rect width="263" height="260" rx="24" fill="#071827" stroke="#8cf3d0" stroke-opacity="0.24"/>
    <rect x="20" y="20" width="223" height="220" rx="18" fill="#0a2130" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle class="monofill" cx="132" cy="91" r="52" fill="#0f3e3c" stroke="url(#monogram)" stroke-width="2"/>
    <circle class="ring" cx="132" cy="91" r="59" fill="none" stroke="#6ee7b7" stroke-width="1.3" stroke-dasharray="18 12" opacity="0.42"/>
    <text class="sans" x="132" y="110" text-anchor="middle" fill="url(#monogram)" font-size="52" font-weight="800" letter-spacing="-4">RH</text>
    <text class="sans" x="132" y="171" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">SUPPORT THAT MOVES</text>
    <text class="sans" x="132" y="192" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">WORK FORWARD</text>
    <line x1="75" y1="212" x2="189" y2="212" stroke="#34d399" stroke-opacity="0.55"/>
  </g>
</svg>
