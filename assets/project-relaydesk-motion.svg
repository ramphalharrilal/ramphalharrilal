<svg xmlns="http://www.w3.org/2000/svg" width="570" height="238" viewBox="0 0 570 238" role="img" aria-labelledby="title desc">
  <title id="title">RelayDesk project card</title>
  <desc id="desc">Flagship WhatsApp support operations system with signed webhooks, privacy protection, ticketing, and human handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0b3533"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75e8c0" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="568" height="236" rx="20"/></clipPath>
    <style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:Consolas,Liberation Mono,monospace}@keyframes border{0%,100%{stroke-opacity:.35;stroke-width:1}50%{stroke-opacity:.9;stroke-width:2}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(830px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.border{animation:border 3s ease-in-out infinite}.shine{animation:sweep 4.2s ease-in-out infinite}.icon{animation:float 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect class="border" x="1" y="1" width="568" height="236" rx="20" fill="url(#bg)" stroke="#34d399" stroke-opacity=".38"/>
  <rect x="1" y="1" width="568" height="236" rx="20" fill="url(#grid)"/>
  <g clip-path="url(#clip)"><path class="shine" d="M-180 0h92L38 238h-92z" fill="#a7f3d0" opacity=".18"/></g>
  <rect x="28" y="26" width="93" height="26" rx="13" fill="#0d493e" stroke="#6ee7b7" stroke-opacity=".5"/>
  <text class="s" x="74.5" y="43" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="800" letter-spacing="1.2">FLAGSHIP</text>
  <g class="icon"><circle cx="510" cy="42" r="18" fill="#103f3b"/><path d="M502 42l5 5 11-12" fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="s" x="28" y="91" fill="#f8fafc" font-size="27" font-weight="780">RelayDesk</text>
  <text class="s" x="28" y="117" fill="#83e9c7" font-size="15" font-weight="650">WhatsApp Support Operations</text>
  <text class="s" x="28" y="150" fill="#b6c5d6" font-size="13.5">Safe automation, prioritized tickets and controlled</text>
  <text class="s" x="28" y="171" fill="#b6c5d6" font-size="13.5">human handoff—with privacy before persistence.</text>
  <text class="m" x="28" y="210" fill="#8ba3b8" font-size="11.5">NODE.JS 22   SIGNED WEBHOOKS   DOCKER   CI</text>
</svg>
