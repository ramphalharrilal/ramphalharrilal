<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ramphal Harrilal — Websites, Support and Practical Business Solutions</title>
  <desc id="desc">A dark navy professional banner with emerald and warm gold highlights, animated minimalist line art inspired by Krishna's flute, a peacock feather and the Sudarshan Chakra.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1b2d"/>
      <stop offset="1" stop-color="#093b39"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#f6c453" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sacredLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d878"/>
      <stop offset="0.5" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7f3d0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9ff4d2" stroke-opacity="0.045"/>
    </pattern>
    <filter id="lineGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace}
      @keyframes breathe{0%,100%{opacity:.68}50%{opacity:1}}
      @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1710px)}}
      @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes floatSoft{0%,100%{transform:translate(0,0) rotate(-7deg)}50%{transform:translate(-5px,-8px) rotate(-4deg)}}
      @keyframes driftFeather{0%,100%{transform:translate(0,0) rotate(5deg)}50%{transform:translate(7px,-10px) rotate(8deg)}}
      @keyframes status{0%,100%{opacity:.5;transform:scale(.76)}50%{opacity:1;transform:scale(1.3)}}
      @keyframes statusRing{0%{opacity:.75;transform:scale(.65)}100%{opacity:0;transform:scale(1.75)}}
      @keyframes spotlight{0%,22%,100%{opacity:.35;fill:#64748b}11%{opacity:1;fill:#6ee7b7}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes reverseSpin{to{transform:rotate(-360deg)}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.12}}
      @keyframes growLine{0%,100%{transform:scaleX(.2);opacity:.45}50%{transform:scaleX(1);opacity:1}}
      @keyframes shimmer{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      .glow{animation:breathe 4.2s ease-in-out infinite}.scanbar{animation:sweep 4.8s ease-in-out infinite}
      .particle{filter:drop-shadow(0 0 6px #34d399)}.p1{animation:floatY 3.8s ease-in-out infinite}.p2{animation:floatY 4.9s ease-in-out infinite}
      .status{transform-box:fill-box;transform-origin:center;animation:status 1.8s ease-in-out infinite}
      .statusRing{transform-box:fill-box;transform-origin:center;animation:statusRing 1.8s ease-out infinite}
      .word{animation:spotlight 8s ease-in-out infinite}.w2{animation-delay:2s}.w3{animation-delay:4s}.w4{animation-delay:6s}
      .cursor{animation:blink .9s steps(1) infinite}.titleLine{transform-origin:left;animation:growLine 3.2s ease-in-out infinite}
      .chakra{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
      .chakraInner{transform-box:fill-box;transform-origin:center;animation:reverseSpin 12s linear infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 9s linear infinite}
      .flute{transform-box:fill-box;transform-origin:center;animation:floatSoft 5.4s ease-in-out infinite}
      .feather{transform-box:fill-box;transform-origin:center;animation:driftFeather 6.2s ease-in-out infinite}
      .sacred{filter:url(#lineGlow);animation:shimmer 4s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect class="glow" width="1200" height="360" rx="24" fill="url(#glow)" opacity="0.72"/>
  <g transform="skewX(-13)"><rect class="scanbar" x="-260" y="0" width="260" height="360" fill="url(#scan)" opacity="0.9"/></g>
  <path d="M0 312C210 277 340 342 563 310S908 255 1200 307V360H0Z" fill="#34d399" opacity="0.04"/>
  <g class="particle" fill="#6ee7b7">
    <circle class="p1" cx="735" cy="71" r="3.2" opacity="0.55"/>
    <circle class="p2" cx="803" cy="292" r="4" opacity="0.42"/>
  </g>

  <g class="sans">
    <rect x="64" y="49" width="228" height="34" rx="17" fill="#0c2d2a" stroke="#34d399" stroke-opacity="0.55"/>
    <circle class="statusRing" cx="84" cy="66" r="7" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <circle class="status" cx="84" cy="66" r="5" fill="#34d399"/>
    <text x="99" y="71" fill="#b8f7dc" font-size="12" font-weight="700" letter-spacing="1.4">OPEN TO REMOTE ROLES</text>

    <text x="64" y="153" fill="#f8fafc" font-size="58" font-weight="760" letter-spacing="-1.8">Ramphal Harrilal</text>
    <text x="66" y="193" fill="#7de4c0" font-size="17" font-weight="700" letter-spacing="2.1">WEBSITES  •  SUPPORT  •  BUSINESS SOLUTIONS</text>
    <rect class="titleLine" x="66" y="206" width="286" height="2" rx="1" fill="#34d399"/>
    <text x="66" y="239" fill="#b8c7d9" font-size="17">I solve operational problems with calm support, clear systems,</text>
    <text x="66" y="265" fill="#b8c7d9" font-size="17">and practical software built around how people actually work.</text>

    <g transform="translate(66 300)">
      <text class="mono word" x="0" y="14" fill="#6ee7b7" font-size="13" opacity="0.5">solve</text>
      <circle cx="53" cy="9" r="2.5" fill="#456176"/>
      <text class="mono word w2" x="67" y="14" fill="#94a3b8" font-size="13" opacity="0.5">document</text>
      <circle cx="145" cy="9" r="2.5" fill="#456176"/>
      <text class="mono word w3" x="159" y="14" fill="#94a3b8" font-size="13" opacity="0.5">improve</text>
      <circle cx="224" cy="9" r="2.5" fill="#456176"/>
      <text class="mono word w4" x="238" y="14" fill="#94a3b8" font-size="13" opacity="0.5">deliver</text>
      <rect class="cursor" x="292" y="1" width="2.5" height="16" rx="1" fill="#6ee7b7"/>
    </g>
  </g>

  <!-- Minimalist Hindu line-art constellation -->
  <g aria-label="Animated minimalist Sudarshan Chakra, Krishna flute and peacock feather">
    <circle cx="1005" cy="174" r="139" fill="#061522" fill-opacity="0.35" stroke="#8cf3d0" stroke-opacity="0.11"/>
    <circle cx="1005" cy="174" r="121" fill="none" stroke="#f6c453" stroke-opacity="0.09" stroke-dasharray="3 11"/>

    <!-- Sudarshan Chakra -->
    <g class="chakra sacred" transform="translate(1005 145)" fill="none" stroke="url(#sacredLine)" stroke-linecap="round" stroke-linejoin="round">
      <circle r="61" stroke-width="1.5" stroke-dasharray="8 7" opacity="0.8"/>
      <circle r="47" stroke-width="1.2" opacity="0.65"/>
      <path d="M0-58V-38M29-50L19-33M50-29L33-19M58 0H38M50 29L33 19M29 50L19 33M0 58V38M-29 50L-19 33M-50 29L-33 19M-58 0H-38M-50-29L-33-19M-29-50L-19-33" stroke-width="2"/>
      <path d="M0-47L7-31L0-22L-7-31ZM47 0L31 7L22 0L31-7ZM0 47L-7 31L0 22L7 31ZM-47 0L-31-7L-22 0L-31 7Z" stroke-width="1.4" opacity="0.78"/>
    </g>
    <g class="chakraInner" transform="translate(1005 145)" fill="none" stroke="#f8d878" stroke-opacity="0.7">
      <circle r="15" stroke-width="1.4"/>
      <circle r="5" fill="#f8d878" fill-opacity="0.38" stroke-width="1"/>
      <path d="M0-15V15M-15 0H15M-10.6-10.6L10.6 10.6M10.6-10.6L-10.6 10.6" stroke-width="0.9"/>
    </g>

    <!-- Krishna's flute -->
    <g class="flute sacred" transform="translate(1002 212) rotate(-7)" fill="none" stroke="url(#sacredLine)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-92 0H86" stroke-width="3"/>
      <path d="M-92-5V5M86-7V7M77-5V5" stroke-width="1.5"/>
      <circle cx="-40" cy="0" r="3" fill="#071827" stroke-width="1.5"/>
      <circle cx="-18" cy="0" r="3" fill="#071827" stroke-width="1.5"/>
      <circle cx="5" cy="0" r="3" fill="#071827" stroke-width="1.5"/>
      <circle cx="28" cy="0" r="3" fill="#071827" stroke-width="1.5"/>
      <circle cx="51" cy="0" r="3" fill="#071827" stroke-width="1.5"/>
      <path d="M-76-1C-62-20-49-25-34-27M-67 0C-57-12-43-16-30-17" stroke-width="1.2" opacity="0.6"/>
      <path d="M-57-17C-66-29-71-37-67-43C-58-43-53-34-57-17Z" stroke-width="1.2"/>
    </g>

    <!-- Peacock feather -->
    <g class="feather sacred" transform="translate(1104 239) rotate(5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-35 70C-18 36-9 5 0-39" stroke="#6ee7b7" stroke-width="2"/>
      <path d="M-27 48C-42 36-45 20-37 8C-23 12-15 23-14 39M-17 19C-30 3-29-15-17-26C-5-18 1-4-5 11M-7-10C-14-26-8-42 5-51C16-39 15-22 4-10M-1-38C6-57 22-66 37-61C38-44 28-29 10-24" stroke="url(#sacredLine)" stroke-width="1.35" opacity="0.82"/>
      <path d="M5-51C16-51 24-43 24-33C24-22 15-14 5-14C-5-14-13-22-13-33C-13-43-5-51 5-51Z" stroke="#f8d878" stroke-width="1.6"/>
      <path d="M5-43C12-43 17-39 17-33C17-27 12-23 5-23C-1-23-6-27-6-33C-6-39-1-43 5-43Z" stroke="#22d3ee" stroke-width="1.3"/>
      <circle cx="5" cy="-33" r="3.5" fill="#6ee7b7" stroke="none"/>
    </g>

    <!-- Orbiting light points -->
    <g class="orbit" transform="translate(1005 174)">
      <circle cx="0" cy="-130" r="3" fill="#f8d878" filter="url(#lineGlow)"/>
      <circle cx="112" cy="66" r="2.5" fill="#6ee7b7" filter="url(#lineGlow)"/>
      <circle cx="-103" cy="79" r="2" fill="#22d3ee" filter="url(#lineGlow)"/>
    </g>
    <text class="sans" x="1005" y="326" text-anchor="middle" fill="#d6e6e3" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.72">PURPOSE • CLARITY • SERVICE</text>
  </g>
</svg>
